name: JE_Editor Dev

on:
  push:
    branches: [ "dev" ]
  pull_request:
    branches: [ "dev" ]
  schedule:
    - cron: "0 4 * * *"

permissions:
  contents: read

jobs:
  build_dev_version:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip wheel
          pip install -r dev_requirements.txt
          pip install -e .
      - name: Run unit tests
        run: python -m pytest test/ -v --tb=short --ignore=test/qt_ui
      - name: Test Start Editor
        timeout-minutes: 2
        env:
          QT_QPA_PLATFORM: offscreen
        run: python ./test/qt_ui/unit_test/start_qt_ui.py
        shell: cmd
      - name: Test Extend Editor
        timeout-minutes: 2
        env:
          QT_QPA_PLATFORM: offscreen
        run: python ./test/qt_ui/unit_test/extend_test.py
        shell: cmd

  publish-dev:
    # The dev channel. A push to dev that passes the tests is built from dev.toml and uploaded when
    # it is still the tip of dev and ships something the newest je_editor_dev does not.
    # scripts/dev_release.py picks the version from PyPI, so nothing is committed back.
    name: Publish je_editor_dev to PyPI
    needs: [build_dev_version]
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 15  # about 3x the slowest recent run, at least 15
    concurrency:
      group: publish-dev
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      # 這個工作拿得到 PyPI token，所以工具只照雜湊鎖定的清單裝、只收 wheel，也不另外升級 pip。
      # 清單與重新產生它的指令在 .github/requirements/publish.in。
      # This job holds the PyPI token, so its tools come from a hash-locked, wheels-only list and pip
      # is not upgraded on the side. The list and the command that regenerates it are in
      # .github/requirements/publish.in.
      - name: Install build tooling
        run: |
          python -m pip install --require-hashes --only-binary :all: -r .github/requirements/publish.txt

      - name: Write pyproject.toml from dev.toml with the next version
        run: python scripts/dev_release.py prepare

      # --no-isolation：用 publish.txt 鎖定的 setuptools 建置；隔離建置會另外下載當下最新的那一版。
      # --no-isolation: build with the setuptools locked in publish.txt; an isolated build downloads
      # whatever is newest at that moment instead.
      - name: Build distribution
        run: python -m build --no-isolation

      - name: Verify distribution metadata
        run: python -m twine check dist/*

      - name: Compare with the newest published wheel
        id: compare
        run: python scripts/dev_release.py changed dist

      # A run that finishes after a newer push would otherwise publish older code as the newest release.
      - name: Check that this commit is still the tip of dev
        id: tip
        run: |
          tip="$(git ls-remote origin refs/heads/dev | cut -f1)"
          if [ "$tip" = "$GITHUB_SHA" ]; then current=true; else current=false; fi
          echo "current=$current" >> "$GITHUB_OUTPUT"

      - name: Publish to PyPI
        if: steps.compare.outputs.changed == 'true' && steps.tip.outputs.current == 'true'
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: python -m twine upload --non-interactive dist/*
